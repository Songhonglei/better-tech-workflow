<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  /* OKLCH three-tier tokens: primitive -> semantic -> component; adjust to the locked aesthetic direction */
  --p-accent: oklch(0.62 0.19 255);
  --p-neutral: oklch(0.27 0.01 260);
  --surface: oklch(0.98 0.004 95);
  --surface-2: oklch(0.95 0.006 95);
  --text: oklch(0.24 0.01 260);
  --text-2: oklch(0.46 0.01 260);
  --accent: var(--p-accent);
  --radius: 10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font:16px/1.65 ui-sans-serif,system-ui;color:var(--text);background:var(--surface);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,[role=button]{cursor:pointer}
.wrap{max-width:72ch;margin:0 auto;padding:0 20px}
h1,h2,h3{line-height:1.2;text-wrap:balance}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="wrap" id="top">
  <h1>__TITLE__</h1>
</header>
<main class="wrap">
  <!-- Content area: whole before detail — never polish one corner on an empty page -->
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
