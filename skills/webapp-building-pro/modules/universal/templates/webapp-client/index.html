<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号与文件</title>
<style>body{font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#172538;margin:0;padding:24px}main{max-width:760px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:16px}section{padding:20px 0;border-top:1px solid #ccd4df}h1{font-size:26px}label{display:block;margin-top:14px}input,button,a{font:inherit}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #a8b7c9;border-radius:5px}button{padding:9px 16px;background:#1757a2;color:white;border:0;border-radius:5px;cursor:pointer;margin:12px 8px 0 0}button:disabled{opacity:.6;cursor:wait}a{color:#1757a2}:focus-visible{outline:3px solid #c36919;outline-offset:3px}#notice{padding:12px 0;min-height:26px}li{padding:12px 0;overflow-wrap:anywhere}li button{background:#526174}#external{display:inline-block;padding:10px 0}small{display:block;color:#495b70}ul{padding-left:20px}[hidden]{display:none!important}@media(max-width:420px){body{padding:16px}button{min-height:44px}}</style></head>
<body><main><header><h1>账号与文件</h1><a href="/">返回应用</a></header><div id="notice" role="status" aria-live="polite"></div>
<section id="auth"><form id="form"><label>账号<input name="username" autocomplete="username" required minlength="3" maxlength="64" pattern="[a-zA-Z0-9][a-zA-Z0-9_.\-]{2,63}"></label><label>密码<input name="password" type="password" autocomplete="current-password" required minlength="12" maxlength="128"></label><small>账号 3–64 位；密码至少 12 位。</small><button type="submit">登录</button><button type="button" id="register" hidden>注册</button></form><a id="external" href="/api/auth/start" hidden>继续登录</a></section>
<section id="profile" hidden><p id="identity"></p><button id="logout">退出登录</button></section>
<section id="files" hidden><h2>我的文件</h2><form id="upload"><label>选择文件<input type="file" name="file" required></label><small>最多 5 MB，仅本人可访问。</small><button type="submit">上传</button></form><ul id="file-list"></ul></section></main><script type="module" src="/account/account.js"></script></body></html>
